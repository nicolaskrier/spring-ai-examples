services:
  postgres:
    image: postgres:18.6
    environment:
      - 'POSTGRES_DB=rag_example'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=user'
    ports:
      - '5432'
  qdrant:
    image: qdrant/qdrant:v1.19-unprivileged
    ports:
      - '6334'
  otel-lgtm:
    image: grafana/otel-lgtm:0.33.0
    ports:
      - '3000:3000'
      - '4317'
      - '4318'
