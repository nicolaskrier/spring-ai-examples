services:
  postgres:
    image: postgres:18.6
    environment:
      - 'POSTGRES_DB=mcp_example'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=user'
    ports:
      - '5432'
  otel-lgtm:
    image: grafana/otel-lgtm:0.33.0
    ports:
      - '3000:3000'
      - '4317'
      - '4318'
  pope-search-mcp-server:
    image: ghcr.io/nicolaskrier/pope-search-mcp-server:latest
    ports:
      - '8080:8080'
  time-mcp-server:
    image: ghcr.io/nicolaskrier/time-mcp-server:latest
    ports:
      - '8081:8081'
